<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Tracer Light theme palette</title>
  <desc id="description">Thirteen numbered key colors with hexadecimal values and usage references.</desc>

  <rect width="1200" height="720" fill="#FAFBFB"/>
  <rect x="24" y="24" width="1152" height="672" fill="none" stroke="#000000" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#34414A">
    <text x="48" y="70" font-size="28" font-weight="700">TRACER LIGHT — KEY COLOR MAP</text>
    <text x="48" y="101" font-size="15">Use the stable label in requests, e.g. “change KEYCOLOR#4 to #00AABB”.</text>
  </g>

  <!-- Left column -->
  <g transform="translate(48 128)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="540" height="68" fill="#FFFFFF" stroke="#000000"/>
    <rect x="12" y="12" width="52" height="44" fill="#000000" stroke="#000000"/>
    <text x="78" y="28" font-size="16" font-weight="700" fill="#34414A">KEYCOLOR#1  #000000</text>
    <text x="78" y="50" font-size="13" fill="#687680">Outer chrome + all borders</text>
  </g>

  <g transform="translate(48 204)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
