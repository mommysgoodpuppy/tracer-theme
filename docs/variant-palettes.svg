<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Tracer Light variant palettes</title>
  <desc id="description">Color references for the ReScript, Deepdark Material, Gruber, and Lobster-inspired Tracer Light variants.</desc>
  <rect width="1200" height="620" fill="#FAFBFB"/>
  <rect x="24" y="24" width="1152" height="572" fill="none" stroke="#000000" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#34414A">
    <text x="48" y="68" font-size="27" font-weight="700">TRACER LIGHT — VARIANT PALETTES</text>
    <text x="48" y="96" font-size="14">Refer to colors by label, e.g. “change GRUBER#3 to #0088AA”. Black chrome is shared by all variants.</text>

    <text x="48" y="142" font-size="18" font-weight="700">RESCRIPT</text>
    <g transform="translate(48 156)">
      <g transform="translate(0)"><rect width="164" height="78" fill="#E6484F" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">RESCRIPT#1</text><text x="10" y="62" fill="#FFFFFF">#E6484F</text></g>
      <g transform="translate(174)"><rect width="164" height="78" fill="#5E5EDE" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">RESCRIPT#2</text><text x="10" y="62" fill="#FFFFFF">#5E5EDE</text></g>
      <g transform="translate(348)"><rect width="164" height="78" fill="#02A875" stroke="#000000"/><text x="10" y="22" fill="#000000" font-weight="700">RESCRIPT#3</text><text x="10" y="62" fill="#000000">#02A875</text></g>
      <g transform="translate(522)"><rect width="164" height="78" fill="#B151DD" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">RESCRIPT#4</text><text x="10" y="62" fill="#FFFFFF">#B151DD</text></g>
      <g transform="translate(696)"><rect width="164" height="78" fill="#DD8C1B" stroke="#000000"/><text x="10" y="22" fill="#000000" font-weight="700">RESCRIPT#5</text><text x="10" y="62" fill="#000000">#DD8C1B</text></g>
      <g transform="translate(870)"><rect width="164" height="78" fill="#3E4057" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">RESCRIPT#6</text><text x="10" y="62" fill="#FFFFFF">#3E4057</text></g>
    </g>

    <text x="48" y="270" font-size="18" font-weight="700">DEEPDARK MATERIAL</text>
    <g transform="translate(48 284)">
      <g transform="translate(0)"><rect width="164" height="78" fill="#007EBB" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">MATERIAL#1</text><text x="10" y="62" fill="#FFFFFF">#007EBB</text></g>
      <g transform="translate(174)"><rect width="164" height="78" fill="#007F7A" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">MATERIAL#2</text><text x="10" y="62" fill="#FFFFFF">#007F7A</text></g>
      <g transform="translate(348)"><rect width="164" height="78" fill="#F3C900" stroke="#000000"/><text x="10" y="22" fill="#000000" font-weight="700">MATERIAL#3</text><text x="10" y="62" fill="#000000">#F3C900</text></g>
      <g transform="translate(522)"><rect width="164" height="78" fill="#6B4BA1" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">MATERIAL#4</text><text x="10" y="62" fill="#FFFFFF">#6B4BA1</text></g>
      <g transform="translate(696)"><rect width="164" height="78" fill="#C43C4B" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">MATERIAL#5</text><text x="10" y="62" fill="#FFFFFF">#C43C4B</text></g>
      <g transform="translate(870)"><rect width="164" height="78" fill="#16865A" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">MATERIAL#6</text><text x="10" y="62" fill="#FFFFFF">#16865A</text></g>
    </g>

    <text x="48" y="398" font-size="18" font-weight="700">GRUBER</text>
