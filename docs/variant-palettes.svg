      <g transform="translate(174)"><rect width="164" height="42" fill="#397D19" stroke="#000000"/><text x="8" y="17" fill="#FFFFFF" font-weight="700">GRUBER#2</text><text x="8" y="34" fill="#FFFFFF">#397D19</text></g>
      <g transform="translate(348)"><rect width="164" height="42" fill="#007E98" stroke="#000000"/><text x="8" y="17" fill="#FFFFFF" font-weight="700">GRUBER#3</text><text x="8" y="34" fill="#FFFFFF">#007E98</text></g>
      <g transform="translate(522)"><rect width="164" height="42" fill="#6E6598" stroke="#000000"/><text x="8" y="17" fill="#FFFFFF" font-weight="700">GRUBER#4</text><text x="8" y="34" fill="#FFFFFF">#6E6598</text></g>
      <g transform="translate(696)"><rect width="164" height="42" fill="#C03943" stroke="#000000"/><text x="8" y="17" fill="#FFFFFF" font-weight="700">GRUBER#5</text><text x="8" y="34" fill="#FFFFFF">#C03943</text></g>
      <g transform="translate(870)"><rect width="164" height="42" fill="#34414A" stroke="#000000"/><text x="8" y="17" fill="#FFFFFF" font-weight="700">GRUBER#6</text><text x="8" y="34" fill="#FFFFFF">#34414A</text></g>
    </g>
    <text x="48" y="510" font-size="18" font-weight="700">LOBSTER</text>
    <g transform="translate(48 524)">
      <g transform="translate(0)"><rect width="164" height="60" fill="#B52F36" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">LOBSTER#1</text><text x="10" y="46" fill="#FFFFFF">#B52F36</text></g>
      <g transform="translate(174)"><rect width="164" height="60" fill="#0F766E" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">LOBSTER#2</text><text x="10" y="46" fill="#FFFFFF">#0F766E</text></g>
      <g transform="translate(348)"><rect width="164" height="60" fill="#A46207" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">LOBSTER#3</text><text x="10" y="46" fill="#FFFFFF">#A46207</text></g>
      <g transform="translate(522)"><rect width="164" height="60" fill="#2563C4" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">LOBSTER#4</text><text x="10" y="46" fill="#FFFFFF">#2563C4</text></g>
      <g transform="translate(696)"><rect width="164" height="60" fill="#16803C" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">LOBSTER#5</text><text x="10" y="46" fill="#FFFFFF">#16803C</text></g>
      <g transform="translate(870)"><rect width="164" height="60" fill="#71717A" stroke="#000000"/><text x="10" y="22" fill="#FFFFFF" font-weight="700">LOBSTER#6</text><text x="10" y="46" fill="#FFFFFF">#71717A</text></g>
